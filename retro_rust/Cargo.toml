[package]
name = "retro_rust"
version = "0.1.0"
edition = "2024"
license = "MIT"

[build-dependencies]
cc = "1.0"
bindgen = "0.71.1"
cmake = "0.1.54"

[dependencies]
cc = "1.2.25"
flate2 = "1.1.1"
arraydeque = "0.5.1"
image = "0.25"
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
rand = "0.9.1"
bytemuck = "1.24.0"
fast_image_resize = { version = "6.0.0", features = ["image"] }

[dev-dependencies]
serial_test = "2.0"
